name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{github.workflow}}-${{github.ref}}
  cancel-in-progress: true

jobs:
  test:
    name: Test parser
    runs-on: ${{matrix.os}}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Pin the tree-sitter CLI to the locked version
        # setup-action installs the latest release by default. A new release that
        # generates parser.c differently (0.27.0 did) then fails "Verify generated
        # parser" on every PR, while `npm run generate` locally, which uses the
        # version package-lock.json locks, stays consistent with the committed
        # files. Install that version instead; dependabot bumps it with the lock.
        id: cli
        shell: bash
        run: echo "ref=v$(node -p "require('./package-lock.json').packages['node_modules/tree-sitter-cli'].version")" >> "$GITHUB_OUTPUT"
      - name: Set up tree-sitter
        uses: tree-sitter/setup-action/cli@v2
        with:
          tree-sitter-ref: ${{steps.cli.outputs.ref}}
      - name: Run parser and binding tests
        uses: tree-sitter/parser-test-action@v2
        with:
          test-rust: true
          test-python: true
          test-go: true
  parse-examples:
    name: Parse examples
    runs-on: ${{matrix.os}}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true
      - name: Pin the tree-sitter CLI to the locked version
        id: cli
        shell: bash
        run: echo "ref=v$(node -p "require('./package-lock.json').packages['node_modules/tree-sitter-cli'].version")" >> "$GITHUB_OUTPUT"
      - name: Set up tree-sitter
        uses: tree-sitter/setup-action@v2
        with:
          install-lib: false
          tree-sitter-ref: ${{steps.cli.outputs.ref}}
      - name: Collect expected parse failures
        id: expected-failures
        shell: bash
        # Corpus files that F#'s own parser rejects (deliberately malformed
        # compiler test fixtures, ...). Passed as invalid-files so they are
        # reported as KNOWN instead of counted as failures. Regenerate the list
        # with `dotnet fsi scripts/find-fsc-parse-failures.fsx`.
        run: |
          # A missing list is a real problem, so check for it explicitly; an
          # empty one is not, so tolerate grep's exit code 1 (no lines left)
          # instead of failing the step under `bash -e`.
          test -f test/fsc-parse-failures.txt
          {
            echo 'files<<EOF'
            grep -v -e '^[[:space:]]*#' -e '^[[:space:]]*$' \
              test/fsc-parse-failures.txt || test $? -eq 1
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
      - name: Parse sample files
        uses: tree-sitter/parse-action@v3
        id: parse-files
        continue-on-error: true
        with:
          files: |-
            examples/**/*.fs
          invalid-files: ${{steps.expected-failures.outputs.files}}
      - name: Upload failures artifact
        uses: actions/upload-artifact@v4
        if: "!cancelled() && steps.parse-files.outcome == 'failure'"
        continue-on-error: true
        with:
          name: failures-${{runner.os}}
          path: ${{steps.parse-files.outputs.failures}}
      - name: Check invalid F# is still detected
        # The step above lists the FSC-rejected files as `invalid-files`, but one
        # of those parsing cleanly is only a warning there, so a grammar that
        # started accepting invalid F# would still go green. This asserts the
        # subset tree-sitter currently catches stays caught.
        if: "!cancelled()"
        shell: bash
        env:
          TREE_SITTER: tree-sitter
        run: dotnet fsi scripts/check-fsc-detected.fsx
      - name: Check no file parses worse than the baseline
        # The parse step counts a file as parsed when a tree comes back, and one
        # comes back even when it is full of ERROR nodes; a file going from 0 to
        # 60 of them stays green there. test/parse-baseline.txt records how many
        # each file has today; more (or a clean file gaining some) fails here.
        if: "!cancelled()"
        shell: bash
        env:
          TREE_SITTER: tree-sitter
        run: dotnet fsi scripts/check-parse-baseline.fsx
      - name: Check every query compiles
        # `tree-sitter test` exercises highlights.scm and locals.scm; the others
        # (injections, indents, tags) can name a node that no longer exists and
        # stay silent until an editor loads them. `-p` picks the grammar: without
        # it a .fsi is parsed with the fsharp grammar, not fsharp_signature.
        if: "!cancelled()"
        shell: bash
        run: |
          status=0
          for q in queries/*.scm; do
            tree-sitter query -p fsharp "$q" test/highlight/expressions.fsx > /dev/null || { echo "::error::$q does not compile against the fsharp parser"; status=1; }
          done
          for q in fsharp_signature/queries/*.scm; do
            tree-sitter query -p fsharp_signature "$q" examples/FSharp.Compiler/src/FSharp.Core/seq.fsi > /dev/null || { echo "::error::$q does not compile against the fsharp_signature parser"; status=1; }
          done
          exit $status
  fuzz:
    name: Fuzz scanner
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [fsharp, fsharp_signature]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Check for scanner changes
        id: scanner-check
        run: |-
          if git diff --quiet HEAD^ -- ${{matrix.language}}/src/scanner.c; then
            printf 'changed=false\n' >> "$GITHUB_OUTPUT"
          else
            printf 'changed=true\n' >> "$GITHUB_OUTPUT"
          fi
      - name: Run the fuzzer
        uses: tree-sitter/fuzz-action@v4
        if: steps.scanner-check.outputs.changed == 'true'
        with:
          directory: ${{matrix.language}}
